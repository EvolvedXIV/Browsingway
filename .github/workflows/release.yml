name: Release

# Builds the plugin and publishes a GitHub release v<Version> (from Browsingway/Browsingway.csproj)
# with Browsingway.zip attached. EvolvedXIV/releases' repo.json points at that asset.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # FlatSharp.Compiler 7.9.0 is built for .NET 9; let it run on the .NET 10 runtime.
      DOTNET_ROLL_FORWARD: Major
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Download Dalamud
        run: |
          mkdir -p ~/.xlcore/dalamud/Hooks/dev
          curl -sSfL -o "$RUNNER_TEMP/dalamud.zip" https://goatcorp.github.io/dalamud-distrib/latest.zip
          unzip -q -o "$RUNNER_TEMP/dalamud.zip" -d ~/.xlcore/dalamud/Hooks/dev

      - name: Build
        run: dotnet build Browsingway.sln -c Release -p:EnableWindowsTargeting=true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's#.*<Version>\(.*\)</Version>.*#\1#p' Browsingway/Browsingway.csproj)
          cp out/Browsingway/latest.zip Browsingway.zip
          notes=$(python3 -c "import json; print(json.load(open('out/Browsingway/Browsingway.json', encoding='utf-8-sig'))['Changelog'])")
          gh release create "v$version" Browsingway.zip \
            --title "Browsingway v$version" \
            --notes "$notes" \
            --target "$GITHUB_SHA"
